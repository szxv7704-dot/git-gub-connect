name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: ["topic/school-data-workflow-ui"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r projects/school-data-workflow/requirements.txt pyinstaller==6.11.1 pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest projects/school-data-workflow/tests -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean projects/school-data-workflow/SchoolDataWorkflow.spec
      - name: Smoke test executable
        run: ./dist/학교자료취합도우미.exe --self-test
      - name: Upload verified executable
        uses: actions/upload-artifact@v4
        with:
          name: 학교자료취합도우미-windows
          path: dist/학교자료취합도우미.exe
          if-no-files-found: error